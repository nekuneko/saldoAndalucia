name: saldo_andalucia
description: "Consulta de saldo de la tarjeta de transporte de Andalucía"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_nfc_kit: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.6
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_logo.png"

flutter_native_splash:
  color: "#007136"
  branding: "assets/images/branding_nekuneko.png"
  image: "assets/images/app_logo.png" # La ruta de tu logotipo centrado

  android_12:
    color: "#007136"
    branding: "assets/images/branding_nekuneko.png"
    image: "assets/images/app_logo_android12.png" # La ruta de tu logotipo centrado